name: PandaPlate
options:
  bundleIdPrefix: com.charlie
  deploymentTarget:
    iOS: "17.0"
targets:
  PandaPlate:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
        com.apple.SignInWithApple:
          enabled: 1
    sources:
      - path: Sources
        excludes:
          - "**/.manus-*"
      - path: PrivacyInfo.xcprivacy
      # Configuration.storekit lives at repo root; referenced by scheme for local StoreKit testing (not bundled).
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/red_panda_welcome_animation.mp4
        buildPhase: resources
      - path: Resources/pip_peek_swipe.gif
        buildPhase: resources
      - path: Resources/PipLife
        buildPhase: resources
        type: folder
    info:
      path: Info.plist
      properties:
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        PandaPlateProxyBaseURL: https://pandaplate-ai-proxy.charliengyt.workers.dev
        NSCameraUsageDescription: PandaPlate uses the camera when you open Food Scan so you can take one still photo of your meal to log. You can also choose a photo from your library.
        NSHealthShareUsageDescription: PandaPlate reads steps, active energy, exercise time, and workouts from Apple Health only when you choose Connect — to show today’s movement and optionally log workouts. We don’t write to Health in this version.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: PandaPlate.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - sdk: HealthKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charlie.pandaplate
        PRODUCT_NAME: PandaPlate
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: PandaPlate
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: PandaPlate lets you choose a meal photo from your library for Food Scan so you can log what you ate without taking a new picture.
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  PandaPlateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes:
          - "**/.manus-*"
    dependencies:
      - target: PandaPlate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charlie.pandaplate.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  PandaPlateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "**/.manus-*"
    dependencies:
      - target: PandaPlate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charlie.pandaplate.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
schemes:
  PandaPlate:
    build:
      targets:
        PandaPlate: all
    run:
      storeKitConfiguration: Configuration.storekit
    test:
      targets:
        - PandaPlateTests
        - PandaPlateUITests
      storeKitConfiguration: Configuration.storekit
